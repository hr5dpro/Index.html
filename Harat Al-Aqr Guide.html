<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harat Al-Aqr Guide</title>
<style>
:root{--bg:#fff;--ink:#111;--gold:#b5832f;--brown:#8a5a28;--c1:#ead6b3;--c2:#e0cba6;--navbg:rgba(236,226,210,.82);--flower:#ece6dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1612;--ink:#f3ece0;--navbg:rgba(60,50,40,.85);--flower:#2a241d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1612;--ink:#f3ece0;--navbg:rgba(60,50,40,.85);--flower:#2a241d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow-y:auto;padding:22px 22px 120px;background:var(--bg)}
.app::before{content:"";position:absolute;right:-30px;top:60px;width:110px;height:110px;border-radius:50%;border:10px solid var(--flower);opacity:.8;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between}
.bell{width:54px;height:54px;border-radius:50%;background:var(--gold);border:0;display:grid;place-items:center;cursor:pointer}
.sq{width:50px;height:46px;border-radius:14px;background:#dcdcdc}
h1{font-size:26px;font-weight:700;margin:30px 0 8px}
.sub{font-size:19px;line-height:1.4;max-width:90%}
.hero{position:relative;margin:20px 0 0;height:205px;border-radius:30px 30px 30px 30px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.slide.on{opacity:1}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:8px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
.dots i.on{background:#7a7a3a}
.card{display:block;position:relative;width:100%;text-align:left;border:0;border-radius:34px;padding:22px 26px;margin-top:20px;min-height:215px;background:linear-gradient(160deg,var(--c1),var(--c2));color:var(--ink);font:inherit;cursor:pointer}

.card h2{font-size:29px;font-weight:600;color:var(--brown);line-height:1.2;max-width:60%;margin-bottom:22px}
.card p{font-size:16px;font-weight:600;max-width:55%;line-height:1.35}
.go{position:absolute;right:26px;bottom:20px;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.35);display:grid;place-items:center}
.art{position:absolute;right:24px;top:30px;transform:translateY(-12px)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(394px,calc(100% - 32px));height:82px;border-radius:36px;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;justify-content:space-around;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.08)}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer;padding:6px 8px}
nav button.on{color:var(--gold)}
nav svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mh{font-size:26px;font-weight:700;margin:30px 0 6px}.mp{font-size:17px;opacity:.8;margin-bottom:18px}.pl{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid transparent;border-radius:26px;padding:18px 20px;margin-bottom:14px;background:linear-gradient(160deg,var(--c1),var(--c2));color:var(--ink);font:inherit;cursor:pointer}.pl.on{border-color:var(--gold)}.pl b{display:block;font-size:21px;color:var(--brown);font-weight:600}.pl span{font-size:15px}.pl svg{flex:none}.act{display:flex;gap:12px;margin-top:20px}.act a{flex:1;text-align:center;text-decoration:none;padding:15px 10px;border-radius:26px;font-weight:600;font-size:16px}.a1{background:var(--gold);color:#fff}.a2{border:2px solid var(--gold);color:var(--gold)}.view{display:none}.view.on{display:block}
.ph{margin-top:60px;text-align:center;font-size:20px;color:var(--brown)}
.ph small{display:block;margin-top:10px;font-size:15px;color:var(--ink);opacity:.7}
.gtop{display:flex;align-items:center;gap:12px;margin:6px 0 14px;font-size:20px}.gback{border:0;background:var(--c1);color:var(--brown);border-radius:20px;padding:8px 16px;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}.gw{position:relative;border-radius:26px;overflow:hidden;background:#000}.gw canvas{display:block;width:100%;height:auto;touch-action:none}#gov{position:absolute;inset:0;background:rgba(40,28,14,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}#gov h3{font-size:26px}#gov p{font-size:16px;line-height:1.4}#gov button{margin-top:8px;border:0;border-radius:26px;background:var(--gold);color:#fff;padding:14px 38px;font-weight:600;font-size:18px;font-family:inherit;cursor:pointer}.gb{display:flex;gap:8px;margin-top:14px}.gb button{flex:1;border:0;border-radius:20px;padding:14px 4px;background:var(--c1);color:var(--brown);font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.wc{background:#25262b;border-radius:30px;overflow:hidden;color:#f1f1f3}.wt{padding:22px 24px 10px}.wn{font-size:19px}.wr{display:flex;justify-content:space-between;align-items:flex-start}.wb{display:flex;align-items:center;gap:10px;font-size:58px;font-weight:500;line-height:1.1}.ws{text-align:right;font-size:21px;padding-top:34px}.ws small{display:block;margin-top:14px;font-size:16px}.wh{display:grid;grid-template-columns:repeat(7,1fr);margin-top:22px;font-size:17px}.wh div{display:flex;flex-direction:column;align-items:center;gap:14px}.wh span{font-size:14px}.wd{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}.wd div{flex:none;width:84px;padding:12px 6px;border-radius:20px;background:#2c2d33;color:#e8e8ec;text-align:center;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent}.wd div.on{border-color:#d5d8e0}.wd small{font-size:14px}
#chat{height:46vh;min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.b{max-width:85%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.45;white-space:pre-wrap}.b.u{align-self:flex-end;background:var(--gold);color:#fff}.b.a{align-self:flex-start;background:var(--c1);color:#2b2013}.cin{display:flex;gap:8px;margin-top:12px}.cin input{flex:1;min-width:0;border:2px solid var(--c2);border-radius:24px;padding:14px 18px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--ink)}.cin button{border:0;border-radius:24px;background:var(--gold);color:#fff;padding:0 20px;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}
.mapb{display:block;margin-top:10px;padding:10px 14px;border-radius:16px;background:var(--gold);color:#fff;text-align:center;text-decoration:none;font-weight:600}
.fr{animation:sway 3.6s ease-in-out infinite;transform-origin:60px 42px}.trk{animation:tsw 4.6s ease-in-out infinite;transform-origin:60px 126px}@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(4.5deg)}}@keyframes tsw{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}@media (prefers-reduced-motion:reduce){.fr,.trk{animation:none}}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
</style>
</head>
